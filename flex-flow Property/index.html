<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành flex-flow Property</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #fafafa;
        }

        h2 {
            margin-top: 20px;
            margin-bottom: 10px;
            color: #333;
        }

        /* Ví dụ 1: flex-flow: row nowrap (Mặc định - Trái qua Phải) */
        .container-1 {
            display: flex;
            flex-flow: row nowrap;
            background-color: #f1f1f1;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .container-1 > div {
            background-color: #007bff;
            color: white;
            width: 100px;
            margin: 10px;
            text-align: center;
            line-height: 50px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 4px;
        }

        /* Ví dụ 2: flex-flow: row-reverse nowrap (Đảo ngược - Phải qua Trái) */
        .container-2 {
            display: flex;
            flex-flow: row-reverse nowrap;
            background-color: #f1f1f1;
            padding: 10px;
            border-radius: 6px;
        }

        .container-2 > div {
            background-color: #28a745;
            color: white;
            width: 100px;
            margin: 10px;
            text-align: center;
            line-height: 50px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>Bài thực hành thuộc tính CSS flex-flow</h1>

    <h2>1. flex-flow: row nowrap</h2>
    <p>Sắp xếp các item nằm trên cùng 1 hàng từ trái qua phải (mặc định):</p>
    <div class="container-1">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>

    <h2>2. flex-flow: row-reverse nowrap</h2>
    <p>Sắp xếp các item nằm trên cùng 1 hàng theo hướng ngược lại (từ phải qua trái):</p>
    <div class="container-2">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>

</body>
</html>
